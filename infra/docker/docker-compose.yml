services:
  postgres:
    image: postgres:16-alpine
    container_name: campusos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusos}
      POSTGRES_DB: ${POSTGRES_DB:-campusos}
    ports:
      - "5432:5432"
    volumes:
      - campusos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d campusos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campusos_pg_data: